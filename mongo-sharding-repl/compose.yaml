name: mongo-sharding-repl

services:
  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27017"
      MONGODB_DATABASE_NAME: "somedb"

  configSvr:
    container_name: configSvr
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configSvr --port 27019 --bind_ip_all
    volumes:
      - mongodb1_data_container:/data/db
    ports:
      - 27019:27019
    healthcheck:
      test: ["CMD", "mongo", "--host", "configSvr", "--port", "27019", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongos_router:
    container_name: mongos_router
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --configdb configSvr/configSvr:27019 --bind_ip_all --port 27017
    ports:
      - 27017:27017
    depends_on:
      - configSvr
      - shard1_1
      - shard1_2
      - shard1_3
      - shard2_1
      - shard2_2
      - shard2_3
    healthcheck:
      test: ["CMD", "mongo", "--host", "mongos_router", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  shard1_1:
    container_name: shard1_1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27020 --bind_ip_all
    volumes:
      - shard1_1_data:/data/db
    ports:
      - 27020:27020
    healthcheck:
      test: ["CMD", "mongo", "--host", "shard1", "--port", "27020", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  shard1_2:
    container_name: shard1_2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27020 --bind_ip_all
    volumes:
      - shard1_2_data:/data/db
    ports:
      - 27120:27120
    healthcheck:
      test: ["CMD", "mongo", "--host", "shard1", "--port", "27020", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  shard1_3:
    container_name: shard1_3
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1 --port 27020 --bind_ip_all
    volumes:
      - shard1_3_data:/data/db
    ports:
      - 27220:27220
    healthcheck:
      test: ["CMD", "mongo", "--host", "shard1", "--port", "27020", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5  

  shard2_1:
    container_name: shard2_1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27021 --bind_ip_all
    volumes:
      - shard2_1_data:/data/db
    ports:
      - 27021:27021
    healthcheck:
      test: ["CMD", "mongo", "--host", "shard2", "--port", "27021", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  shard2_2:
    container_name: shard2_2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27021 --bind_ip_all
    volumes:
      - shard2_2_data:/data/db
    ports:
      - 27121:27121
    healthcheck:
      test: ["CMD", "mongo", "--host", "shard2", "--port", "27021", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  shard2_3:
    container_name: shard2_3
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2 --port 27021 --bind_ip_all
    volumes:
      - shard2_3_data:/data/db
    ports:
      - 27221:27221
    healthcheck:
      test: ["CMD", "mongo", "--host", "shard2", "--port", "27021", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  mongodb1_data_container:
  shard1_1_data:
  shard1_2_data:
  shard1_3_data:
  shard2_1_data:
  shard2_2_data:
  shard2_3_data:
